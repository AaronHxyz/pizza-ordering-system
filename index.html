<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="card">

        <form action="#" method="post">

            <fieldset>
                <legend>Customer Information</legend>

                <label for="name">Name:</label>
                <input type="text" id="name" required minlength="2">

                <label for="address">Address:</label>
                <input type="text" id="address" required>

                <label for="phone">Phone:</label>
                <input type="tel"
                       id="phone"
                       required
                       pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                       placeholder="123-456-7890">

            </fieldset>

            <fieldset>
                <legend>The Order</legend>

                <p>Crust:</p>
                    <div class="radio-wrapper">
                        <label for="thin">
                            <input type="radio" id="thin" name="crust" value="thin" required>
                            Thin
                        </label>

                        <label for="classic">
                            <input type="radio" id="classic" name="crust" value="classic" required>
                            Classic
                        </label>

                        <label for="deep-dish">
                            <input type="radio" id="deep" name="crust" value="deep" required>
                            Deep Dish
                        </label>
                    </div>

                <p>Toppings:</p>
                    <div class="checkbox-wrapper">
                        <label for="pepperoni">
                            <input type="checkbox" id="pepperoni" name="toppings" value="pepperoni">
                            Pepperoni
                        </label>

                        <label for="mushroom">
                            <input type="checkbox" id="mushroom" name="toppings" value="mushroom">
                            Mushroom
                        </label>

                        <label for="olives">
                            <input type="checkbox" id="olives" name="toppings" value="olives">
                            Olives
                        </label>

                        <label for="green-peppers">
                            <input type="checkbox" id="green peppers" name="toppings" value="green peppers">
                            Green Peppers 
                        </label>
                    </div>

                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" name="quantity" required min="1" max="10">
                            
                    
            </fieldset>

            <fieldset>
                <legend>Delivery and Payment</legend>

                <label for="instructions">Delivery instructions:</label>
                <textarea id="instructions"></textarea>

                <label for="delivery-time">Delivery Time:</label>
                <input type="datetime-local" id="delivery-time" required min="2026-10-05T00:00">

                <label for="payment">Payment method:</label>
                    <select id="payment" required>
                        <option value="">Select a payment method</option>
                        <option value="cash">Cash</option>
                        <option value="card">Card</option>
                        <option value="debit">Debit</option>
                    </select>
                <div class="button-wrapper">
                    <button type="submit">Submit Order</button>
                    <button type="reset">Reset</button>
                </div>
            </fieldset>

        </form>

        <aside>
            <!-- Order summary table goes here -->
             <table>
                <caption>Order Summary</caption>

                <thead>
                    <tr>
                        <th scope="col">Item</th>
                        <th scope="col">Details</th>
                        <th scope="col">Price</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Base pizza</td>
                        <td>Large (12"), Thin crust</td>
                        <td>$16.99</td>
                    </tr>

                    <tr>
                        <td>Toppings</td>
                        <td>Mushrooms, Olives, Extra cheese</td>
                        <td>$4.50</td>
                    </tr>

                    <tr>
                        <td>Delivery Fee</td>
                        <td>Standard delivery</td>
                        <td>$3.99</td>
                    </tr>

                </tbody>

                <tfoot>
                    <tr>
                        <th scope="row">Total</th>
                        <td>Example total</td>
                        <td>$25.48</td>
                    </tr>
                </tfoot>

             </table>
        </aside>

    </main>
</body>
</html>
